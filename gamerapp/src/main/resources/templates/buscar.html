<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Buscar Eventos - GamerCommunity</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
          crossorigin="anonymous">
          
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-dark text-white">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary px-4">
        <a class="navbar-brand fw-bold text-info" th:href="@{/}">🎮 GamerCommunity</a>
        <div class="ms-auto">
            <a th:href="@{/login}" class="btn btn-outline-info btn-sm">Iniciar Sesión</a>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="text-info mb-4">Catálogo Público de Eventos</h2>
        <p class="text-light">Explora los eventos de la comunidad. Para ver los detalles completos e inscribirte, debes estar registrado e iniciar sesión.</p>
        
        <div class="card bg-dark border-secondary text-white mt-4">
            <div class="card-body">
                <h5 class="card-title text-info">Eventos Disponibles</h5>
                <p class="card-text">Torneos de Valorant, LAN Parties y exhibiciones.</p>
                <a th:href="@{/eventos}" class="btn btn-primary">Ver Detalles Exclusivos (Requiere Login)</a>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
            crossorigin="anonymous"></script>
</body>
</html>

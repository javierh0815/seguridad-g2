<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - GamerCommunity</title>
    

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
          crossorigin="anonymous">
          
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-dark text-white">

    <div class="card p-4 shadow bg-dark text-white border-secondary" style="width: 350px;">
        <h2 class="text-center mb-4 text-info">Login Gamer</h2>
        

        <div th:if="${param.error != null or error != null}" class="alert alert-danger text-center p-2">
            Usuario o contraseña incorrectos.
        </div>
        <div th:if="${param.logout != null or msg != null}" class="alert alert-success text-center p-2">
            <span th:text="${msg != null ? msg : 'Has cerrado sesión exitosamente.'}"></span>
        </div>
        <div th:if="${param.registrado != null}" class="alert alert-info text-center p-2">
            ¡Registro exitoso! Ya puedes iniciar sesión.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control bg-dark text-white border-secondary" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control bg-dark text-white border-secondary" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-gamer w-100 mb-2">Entrar</button>
        </form>
        <div class="text-center mt-3">
            <a th:href="@{/}" class="text-info text-decoration-none">Volver al inicio</a>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
            crossorigin="anonymous"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - GamerCommunity</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card p-4 shadow" style="width: 350px;">
        <h2 class="text-center mb-4">Login Gamer</h2>
        
        <div th:if="${param.error}" class="alert alert-danger text-center p-2">
            Usuario o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="alert alert-success text-center p-2">
            Has cerrado sesión exitosamente.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control bg-dark text-white border-secondary" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control bg-dark text-white border-secondary" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-gamer w-100 mb-2">Entrar</button>
        </form>
        <div class="text-center mt-3">
            <a href="/" class="text-info text-decoration-none">Volver al inicio</a>
        </div>
    </div>

</body>
</html>

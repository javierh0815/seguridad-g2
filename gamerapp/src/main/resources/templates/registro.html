<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - GamerCommunity</title>
    

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
          crossorigin="anonymous">
          
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-dark text-white">

    <div class="card p-4 shadow bg-dark text-white border-secondary" style="width: 400px;">
        <h2 class="text-center mb-4 text-info">Registro Gamer</h2>
        

        <div th:if="${error != null}" class="alert alert-danger text-center p-2" th:text="${error}">
            Error al registrar la cuenta.
        </div>

        <form th:action="@{/registro}" th:object="${user}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Nombre de usuario</label>
                <input type="text" th:field="*{username}" class="form-control bg-dark text-white border-secondary" id="username" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" th:field="*{email}" class="form-control bg-dark text-white border-secondary" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" th:field="*{password}" class="form-control bg-dark text-white border-secondary" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-gamer w-100 mb-2">Registrarse</button>
        </form>
        
        <div class="text-center mt-3">
            <span class="text-white-50">¿Ya tienes cuenta? </span>
            <a th:href="@{/login}" class="text-info text-decoration-none">Inicia sesión</a>
        </div>
        <div class="text-center mt-2">
            <a th:href="@{/}" class="text-secondary text-decoration-none small">Volver al inicio</a>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
            crossorigin="anonymous"></script>

</body>
</html>

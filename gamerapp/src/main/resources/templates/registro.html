<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - GamerCommunity</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card p-4 shadow" style="width: 400px;">
        <h2 class="text-center mb-4">Registro Gamer</h2>
        

        <form th:action="@{/registro}" th:object="${user}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Nombre de usuario</label>
                <input type="text" th:field="*{username}" class="form-control bg-dark text-white border-secondary" id="username" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" th:field="*{email}" class="form-control bg-dark text-white border-secondary" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" th:field="*{password}" class="form-control bg-dark text-white border-secondary" id="password" required>
            </div>
            <button type="submit" class="btn btn-gamer w-100 mb-2">Registrarse</button>
        </form>
        
        <div class="text-center mt-3">
            <a th:href="@{/}" class="text-info text-decoration-none">Volver al inicio</a>
        </div>
    </div>

</body>
</html>

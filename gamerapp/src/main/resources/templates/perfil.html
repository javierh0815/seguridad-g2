<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil Gamer - GamerCommunity</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark px-4">
        <a class="navbar-brand fw-bold text-info" href="/">🎮 GamerCommunity</a>
        <div class="ms-auto">
            <a href="/" class="btn btn-outline-light btn-sm me-2">Volver al Inicio</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
            </form>
        </div>
    </nav>

    <!-- Contenido del Perfil -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4 shadow bg-dark border-secondary text-white">
                    <h2 class="text-center mb-4 text-info">Configuración de Perfil</h2>
                    
                    <form>
                        <div class="mb-3">
                            <label for="username" class="form-label">Nombre de Usuario</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" id="username" th:value="${#authentication.name}" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="avatar" class="form-label">URL del Avatar / Imagen</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" id="avatar" placeholder="https://ejemplo.com/avatar.png">
                        </div>
                        <div class="mb-3">
                            <label for="juegos" class="form-label">Juegos de Interés</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" id="juegos" placeholder="Ej: Valorant, League of Legends, Elden Ring">
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input bg-dark border-secondary" id="notificaciones" checked>
                            <label class="form-check-label text-light" for="notificaciones">Recibir notificaciones de nuevos torneos y eventos</label>
                        </div>
                        <button type="submit" class="btn btn-gamer w-100">Guardar Cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>

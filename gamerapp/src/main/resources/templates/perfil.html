<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil Gamer - GamerCommunity</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
          crossorigin="anonymous">
          
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-dark text-white">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary px-4">
        <a class="navbar-brand fw-bold text-info" th:href="@{/}">🎮 GamerCommunity</a>
        <div class="ms-auto d-flex align-items-center">
            <a th:href="@{/}" class="btn btn-outline-light btn-sm me-2">Volver al Inicio</a>
            <form th:action="@{/logout}" method="post" class="d-inline m-0">
                <button type="submit" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
            </form>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4 shadow bg-dark border-secondary text-white">
                    <h2 class="text-center mb-4 text-info">Configuración de Perfil</h2>
                    
                    <form th:action="@{/perfil}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Nombre de Usuario</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" id="username" th:value="${#authentication.name}" readonly>
                        </div>
                        
                        <div class="mb-3" sec:authorize="isAuthenticated()">
                            <label class="form-label text-muted">Rol en el sistema:</label>
                            <span class="badge bg-info text-dark" sec:authentication="principal.authorities">[ROLE_USER]</span>
                        </div>

                        <div class="mb-3">
                            <label for="avatar" class="form-label">URL del Avatar / Imagen</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" id="avatar" name="avatar" placeholder="https://ejemplo.com/avatar.png">
                        </div>
                        <div class="mb-3">
                            <label for="juegos" class="form-label">Juegos de Interés</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" id="juegos" name="juegos" placeholder="Ej: Valorant, League of Legends, Elden Ring">
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input bg-dark border-secondary" id="notificaciones" name="notificaciones" checked>
                            <label class="form-check-label text-light" for="notificaciones">Recibir notificaciones de nuevos torneos y eventos</label>
                        </div>
                        <button type="submit" class="btn btn-primary btn-gamer w-100">Guardar Cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
            crossorigin="anonymous"></script>

</body>
</html>

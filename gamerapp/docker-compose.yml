services:
  mysql-cdy2203:
    image: mysql:8.0
    container_name: mysql-cdy2203
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_cdy2203_data:/var/lib/mysql

  gamer-app:
    build:
      context: .
      args:
        KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
    container_name: gamer-app-container
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-cdy2203:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
    depends_on:
      - mysql-cdy2203

volumes:
  mysql_cdy2203_data: